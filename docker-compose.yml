services:
    lotoquest:
        build: .
        ports:
            - "8080:80"
        environment:
            # LOTOQUEST_BASE_PATH: /lotoquest
            LOTOQUEST_DEBUG: "0"
        volumes:
            # drawn numbers, kept between restarts
            - draws:/var/www/html/csv
            # edit loto.csv and logos without rebuilding the image
            - ./public/assets:/var/www/html/public/assets:ro

    # docker compose run --rm tests
    tests:
        image: composer:2
        profiles: ["tests"]
        working_dir: /app
        volumes:
            - .:/app
        command: sh -c "composer install --no-interaction && composer test"

volumes:
    draws:
